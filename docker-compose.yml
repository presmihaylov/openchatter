services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      OPENCHATTER_DB_URL: postgres://agentchat:agentchat@db:5432/agentchat?sslmode=disable
      OPENCHATTER_PORT: "8090"
      OPENCHATTER_PUBLIC_URL: http://localhost:8090
      # OPENAI_API_KEY comes from .env (gitignored); without it the app runs
      # with semantic search disabled
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentchat
      POSTGRES_PASSWORD: agentchat
      POSTGRES_DB: agentchat
    ports:
      - "5477:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentchat"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
